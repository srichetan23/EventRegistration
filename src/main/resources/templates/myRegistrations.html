<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Registrations — Eventify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-eventify sticky-top">
      <div class="container">
        <a class="navbar-brand brand" href="/"><i class="bi bi-calendar2-event-fill"></i>Eventify</a>
        <div class="ms-auto d-flex align-items-center gap-2 gap-md-3">
          <a class="btn btn-outline-brand btn-sm" href="/eventRegPage"><i class="bi bi-grid me-1"></i>All Events</a>
          <span class="user-chip d-none d-sm-inline"><i class="bi bi-person-circle me-1"></i><span sec:authentication="name">user</span></span>
          <form method="post" th:action="@{/logout}">
            <button type="submit" class="btn btn-outline-danger btn-sm">Logout</button>
          </form>
        </div>
      </div>
    </nav>

    <header class="page-band">
      <div class="container">
        <h1 class="mb-1">My Registrations</h1>
        <p class="mb-0 opacity-75">Events you've signed up for.</p>
      </div>
    </header>

    <div class="container py-5">
      <div th:if="${#lists.isEmpty(myEvents)}" class="text-center text-muted py-5">
        <i class="bi bi-ticket-perforated" style="font-size:3rem;opacity:.4"></i>
        <p class="mt-3">You haven't registered for any events yet.</p>
        <a class="btn btn-brand" href="/eventRegPage">Browse events</a>
      </div>

      <div th:unless="${#lists.isEmpty(myEvents)}" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="event : ${myEvents}"
             th:with="theme=${event.name == 'Musical' ? 'ev-musical' : event.name == 'Dance' ? 'ev-dance' : event.name == 'Art' ? 'ev-art' : event.name == 'Boxing' ? 'ev-boxing' : event.name == 'Chess' ? 'ev-chess' : event.name == 'Coding' ? 'ev-coding' : 'ev-default'},
                      icon=${event.name == 'Musical' ? 'bi-music-note-beamed' : event.name == 'Dance' ? 'bi-people-fill' : event.name == 'Art' ? 'bi-palette-fill' : event.name == 'Boxing' ? 'bi-trophy-fill' : event.name == 'Chess' ? 'bi-puzzle-fill' : event.name == 'Coding' ? 'bi-code-slash' : 'bi-calendar-event'}">
          <div class="event-card">
            <div class="event-banner" th:classappend="${theme}">
              <i class="bi" th:classappend="${icon}"></i>
            </div>
            <div class="card-body d-flex flex-column p-4">
              <h4 class="fw-bold mb-2" th:text="${event.name}">Event</h4>
              <div class="event-meta mb-1"><i class="bi bi-calendar3 me-2"></i><span th:text="${#temporals.format(event.eventDate, 'EEE, dd MMM yyyy')}">date</span></div>
              <div class="event-meta mb-3"><i class="bi bi-geo-alt me-2"></i><span th:text="${event.location}">venue</span></div>
              <form method="post" th:action="@{/cancelRegistration}" class="mt-auto d-grid">
                <input type="hidden" name="eventNumber" th:value="${event.id}" />
                <button type="submit" class="btn btn-outline-danger"><i class="bi bi-x-circle me-1"></i>Cancel registration</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
