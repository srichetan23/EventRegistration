<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact — Eventify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-eventify sticky-top">
      <div class="container">
        <a class="navbar-brand brand" href="/"><i class="bi bi-calendar2-event-fill"></i>Eventify</a>
        <div class="ms-auto d-flex gap-2">
          <a class="btn btn-outline-brand" href="/login">Login</a>
          <a class="btn btn-brand" href="/register">Sign Up</a>
        </div>
      </div>
    </nav>

    <header class="page-band">
      <div class="container">
        <h1 class="mb-1">Get in touch</h1>
        <p class="mb-0 opacity-75">Questions about an event? Reach out.</p>
      </div>
    </header>

    <div class="container py-5">
      <div class="row g-4">
        <div class="col-md-4">
          <div class="card panel h-100"><div class="card-body text-center p-4">
            <i class="bi bi-envelope-fill text-primary" style="font-size:2rem"></i>
            <h5 class="mt-3 fw-semibold">Email</h5>
            <p class="text-muted mb-0">support@eventify.app</p>
          </div></div>
        </div>
        <div class="col-md-4">
          <div class="card panel h-100"><div class="card-body text-center p-4">
            <i class="bi bi-telephone-fill text-primary" style="font-size:2rem"></i>
            <h5 class="mt-3 fw-semibold">Phone</h5>
            <p class="text-muted mb-0">+91 00000 00000</p>
          </div></div>
        </div>
        <div class="col-md-4">
          <div class="card panel h-100"><div class="card-body text-center p-4">
            <i class="bi bi-geo-alt-fill text-primary" style="font-size:2rem"></i>
            <h5 class="mt-3 fw-semibold">Campus</h5>
            <p class="text-muted mb-0">Student Activities Center</p>
          </div></div>
        </div>
      </div>
      <div class="text-center mt-5">
        <a href="/" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
      </div>
    </div>
  </body>
</html>
