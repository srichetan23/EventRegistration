<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Events - Best Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Best Store</a>
        <span class="navbar-text ms-auto me-3">
          Signed in as <strong sec:authentication="name">user</strong>
        </span>
        <form method="post" th:action="@{/logout}">
          <button type="submit" class="btn btn-outline-danger">Logout</button>
        </form>
      </div>
    </nav>

    <div class="container py-5">
      <h1 class="text-center mb-4">Upcoming Events</h1>

      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="event : ${events}">
          <div class="card h-100 shadow-sm">
            <div class="card-body d-flex flex-column">
              <h4 class="card-title" th:text="${event.name}">Event</h4>
              <p class="card-text text-muted mb-4">
                <span>Date: </span>
                <span th:text="${#temporals.format(event.eventDate, 'dd MMM yyyy')}">01 Jan 2026</span>
              </p>

              <div class="mt-auto">
                <span th:if="${registeredEventNumbers.contains(event.id)}"
                      class="badge bg-success p-2">&#10003; Already Registered</span>

                <form th:unless="${registeredEventNumbers.contains(event.id)}"
                      method="post" th:action="@{/registerEvent}" class="d-grid">
                  <input type="hidden" name="eventNumber" th:value="${event.id}" />
                  <button type="submit" class="btn btn-primary">Register</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
