<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — Eventify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-eventify">
      <div class="container">
        <a class="navbar-brand brand" href="/"><i class="bi bi-calendar2-event-fill"></i>Eventify</a>
      </div>
    </nav>

    <div class="auth-wrap">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-9">
            <div class="card auth-card">
              <div class="row g-0">
                <div class="col-md-5 auth-side d-flex flex-column justify-content-center">
                  <i class="bi bi-emoji-smile mb-3"></i>
                  <h3 class="fw-bold">Welcome back!</h3>
                  <p class="opacity-75 mb-0">Log in to browse events and manage your registrations.</p>
                </div>
                <div class="col-md-7">
                  <div class="p-4 p-md-5">
                    <h4 class="fw-bold mb-4">Login to your account</h4>

                    <div th:if="${param.error}" class="alert alert-danger py-2"><i class="bi bi-exclamation-circle me-1"></i>Invalid username or password.</div>
                    <div th:if="${param.logout}" class="alert alert-success py-2"><i class="bi bi-check-circle me-1"></i>You have been logged out.</div>
                    <div th:if="${param.registered}" class="alert alert-success py-2"><i class="bi bi-check-circle me-1"></i>Registration successful. Please log in.</div>

                    <form method="post" th:action="@{/login}">
                      <div class="mb-3">
                        <label class="form-label fw-medium">Username (your Name)</label>
                        <div class="input-group">
                          <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                          <input type="text" name="username" class="form-control" required autofocus />
                        </div>
                      </div>
                      <div class="mb-4">
                        <label class="form-label fw-medium">Password</label>
                        <div class="input-group">
                          <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                          <input type="password" name="password" class="form-control" required />
                        </div>
                      </div>
                      <div class="d-grid">
                        <button type="submit" class="btn btn-brand btn-lg">Login</button>
                      </div>
                    </form>

                    <p class="text-center mt-4 mb-0 text-muted">No account? <a href="/register" class="fw-semibold" style="color:var(--brand)">Register here</a></p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
