<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login — Eventify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-eventify">
      <div class="container">
        <a class="navbar-brand brand" href="/"><i class="bi bi-calendar2-event-fill"></i>Eventify</a>
      </div>
    </nav>

    <div class="auth-wrap">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-5">
            <div class="card auth-card">
              <div class="auth-side text-center">
                <i class="bi bi-shield-lock mb-2"></i>
                <h4 class="fw-bold mb-0">Admin Access</h4>
              </div>
              <div class="p-4 p-md-5">
                <div th:if="${errorMsg}" class="alert alert-danger py-2"><i class="bi bi-exclamation-circle me-1"></i><span th:text="${errorMsg}"></span></div>
                <form action="#" th:action="@{/adminLogin}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Admin Name</label>
                        <div class="input-group">
                          <span class="input-group-text bg-white"><i class="bi bi-person-badge"></i></span>
                          <input type="text" name="adminName" class="form-control" required autofocus />
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-medium">Password</label>
                        <div class="input-group">
                          <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                          <input type="password" name="password" class="form-control" required />
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-brand btn-lg">Login as Admin</button>
                    </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
</body>
</html>
