<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up — Eventify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
  </head>
  <body>
    <nav class="navbar navbar-eventify">
      <div class="container">
        <a class="navbar-brand brand" href="/"><i class="bi bi-calendar2-event-fill"></i>Eventify</a>
      </div>
    </nav>

    <div class="auth-wrap">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-9">
            <div class="card auth-card">
              <div class="row g-0">
                <div class="col-md-5 auth-side d-flex flex-column justify-content-center order-md-2">
                  <i class="bi bi-stars mb-3"></i>
                  <h3 class="fw-bold">Join Eventify</h3>
                  <p class="opacity-75 mb-0">Create an account to register for events and track them in one place.</p>
                </div>
                <div class="col-md-7 order-md-1">
                  <div class="p-4 p-md-5">
                    <h4 class="fw-bold mb-4">Create your account</h4>
                    <form method="post" th:object="${registerDto}">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                      <div class="mb-3">
                        <label class="form-label fw-medium">Name</label>
                        <div class="input-group">
                          <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                          <input class="form-control" th:field="*{name}" placeholder="Your name" />
                        </div>
                        <small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
                      </div>

                      <div class="mb-3">
                        <label class="form-label fw-medium">Email</label>
                        <div class="input-group">
                          <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                          <input class="form-control" th:field="*{email}" placeholder="you@example.com" />
                        </div>
                        <small class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                      </div>

                      <div class="mb-4">
                        <label class="form-label fw-medium">Password</label>
                        <div class="input-group">
                          <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                          <input class="form-control" type="password" th:field="*{password}" placeholder="At least 4 characters" />
                        </div>
                        <small class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
                      </div>

                      <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-brand btn-lg">Create Account</button>
                        <a href="/" class="btn btn-outline-secondary">Cancel</a>
                      </div>
                    </form>

                    <p class="text-center mt-4 mb-0 text-muted">Already have an account? <a href="/login" class="fw-semibold" style="color:var(--brand)">Login</a></p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
