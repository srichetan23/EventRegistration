<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard — Eventify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-eventify sticky-top">
      <div class="container">
        <a class="navbar-brand brand" href="/"><i class="bi bi-calendar2-event-fill"></i>Eventify <span class="text-muted fw-normal fs-6 ms-1">Admin</span></a>
        <div class="ms-auto d-flex align-items-center gap-3">
          <span class="user-chip"><i class="bi bi-shield-lock me-1"></i><span th:text="${adminName}">Srichetan</span></span>
          <a href="/" class="btn btn-outline-secondary btn-sm">Home</a>
        </div>
      </div>
    </nav>

    <header class="page-band">
      <div class="container">
        <h1 class="mb-1">Dashboard</h1>
        <p class="mb-0 opacity-75">Overview of users and event registrations.</p>
      </div>
    </header>

    <div class="container py-5">
        <!-- Summary cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card stat-card stat-1">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div><div class="small text-uppercase opacity-75">Total Users</div><div class="num" th:text="${totalUsers}">0</div></div>
                        <i class="bi bi-people-fill" style="font-size:2.4rem;opacity:.5"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card stat-2">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div><div class="small text-uppercase opacity-75">Registrations</div><div class="num" th:text="${totalRegistrations}">0</div></div>
                        <i class="bi bi-ticket-perforated-fill" style="font-size:2.4rem;opacity:.5"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card stat-3">
                    <div class="card-body d-flex align-items-center justify-content-between">
                        <div><div class="small text-uppercase opacity-75">Events</div><div class="num" th:text="${totalEvents}">0</div></div>
                        <i class="bi bi-calendar-event-fill" style="font-size:2.4rem;opacity:.5"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chart -->
        <div class="card panel mb-4">
            <div class="card-body">
                <h5 class="fw-semibold mb-3">Registrations per Event</h5>
                <canvas id="eventChart" height="100"></canvas>
            </div>
        </div>

        <!-- Table -->
        <div class="card panel">
          <div class="card-body">
            <h5 class="fw-semibold mb-3">All Registrations</h5>
            <p th:if="${#lists.isEmpty(registrations)}" class="text-muted mb-0">No registrations yet.</p>
            <div th:unless="${#lists.isEmpty(registrations)}" class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                  <thead>
                      <tr class="text-muted small text-uppercase">
                          <th>User</th>
                          <th>Event No.</th>
                          <th>Event</th>
                      </tr>
                  </thead>
                  <tbody>
                      <tr th:each="reg : ${registrations}">
                          <td><i class="bi bi-person-circle me-2 text-secondary"></i><span th:text="${reg.userEmail}"></span></td>
                          <td th:text="${reg.eventNumber}"></td>
                          <td><span class="badge bg-primary-subtle text-primary-emphasis" th:text="${reg.eventName}"></span></td>
                      </tr>
                  </tbody>
              </table>
            </div>
          </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script th:inline="javascript">
        const labels = /*[[${chartLabels}]]*/ [];
        const data = /*[[${chartData}]]*/ [];

        new Chart(document.getElementById('eventChart'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Registrations',
                    data: data,
                    backgroundColor: '#4f46e5',
                    borderRadius: 6,
                    maxBarThickness: 60
                }]
            },
            options: {
                scales: { y: { beginAtZero: true, ticks: { precision: 0 } } },
                plugins: { legend: { display: false } }
            }
        });
    </script>
</body>
</html>
