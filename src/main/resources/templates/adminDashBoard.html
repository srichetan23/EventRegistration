<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Best Store</a>
        <span class="navbar-text">
          Admin: <strong th:text="${adminName}">Srichetan</strong>
        </span>
      </div>
    </nav>

    <div class="container py-5">
        <h2 class="mb-4">Event Registrations</h2>

        <p th:if="${#lists.isEmpty(registrations)}" class="text-muted">
            No registrations yet.
        </p>

        <table th:unless="${#lists.isEmpty(registrations)}" class="table table-striped table-bordered align-middle">
            <thead class="table-dark">
                <tr>
                    <th>User</th>
                    <th>Event No.</th>
                    <th>Event</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="reg : ${registrations}">
                    <td th:text="${reg.userEmail}"></td>
                    <td th:text="${reg.eventNumber}"></td>
                    <td th:text="${reg.eventName}"></td>
                </tr>
            </tbody>
        </table>

        <a href="/" class="btn btn-outline-secondary">Back to Home</a>
    </div>
</body>
</html>
