spring.application.name=MyStore

server.port=7478

# ---------------------------------------------------------------------------
# Default database: MySQL. Values can be overridden with environment variables
# (handy for Docker / cloud), falling back to sensible local defaults.
#   DB_URL, DB_USERNAME, DB_PASSWORD
# For quick throwaway testing without MySQL, run with: --spring.profiles.active=h2
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/springbootproject?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
