spring.application.name=MyStore

server.port=7478

# ---------------------------------------------------------------------------
# Default database: MySQL (your local springbootproject database).
# The DB is auto-created if it doesn't exist. Make sure MySQL is running.
# For quick throwaway testing without MySQL, run with:
#     --spring.profiles.active=h2
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/springbootproject?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
